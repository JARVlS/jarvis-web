services:
  frontend:
    build:
      context: ./frontend
    container_name: jarvis-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  backend:
    build:
      context: ./backend
    container_name: jarvis-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"